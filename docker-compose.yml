services:
  postgres:
    image: postgres:16-alpine
    container_name: automata-postgres
    environment:
      POSTGRES_USER: automata
      POSTGRES_PASSWORD: automata_password
      POSTGRES_DB: automata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automata -d automata"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
