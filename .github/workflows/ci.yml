name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  database-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore full backup and replay WAL
        run: sh ops/postgres/test-recovery.sh

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automata
          POSTGRES_PASSWORD: automata
          POSTGRES_DB: automata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path internal/database/migrations -database "postgres://automata:automata@localhost:5432/automata?sslmode=disable" up
        env:
          DATABASE_URL: postgres://automata:automata@localhost:5432/automata?sslmode=disable

      - name: Test
        run: go test ./... -race -cover
        env:
          DATABASE_URL: postgres://automata:automata@localhost:5432/automata?sslmode=disable
          TEST_DATABASE_URL: postgres://automata:automata@localhost:5432/automata?sslmode=disable
          JWT_SECRET: ci-test-secret-do-not-use-in-production-ok
          ENV: development

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npx playwright install --with-deps chromium

      - name: Browser workflow regression
        run: |
          go build -o /tmp/automata-e2e ./cmd/server
          /tmp/automata-e2e > /tmp/automata-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          cd ../frontend
          npm run test:e2e
        env:
          DATABASE_URL: postgres://automata:automata@localhost:5432/automata?sslmode=disable
          JWT_SECRET: ci-test-secret-do-not-use-in-production-ok
          ENV: development
          TEST_DISABLE_RATE_LIMIT: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            frontend/test-results
            /tmp/automata-e2e.log
