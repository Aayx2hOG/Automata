name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automata
          POSTGRES_PASSWORD: automata
          POSTGRES_DB: automata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run migrations
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          migrate -path internal/database/migrations -database "postgres://automata:automata@localhost:5432/automata?sslmode=disable" up
        env:
          DATABASE_URL: postgres://automata:automata@localhost:5432/automata?sslmode=disable

      - name: Test
        run: go test ./... -race -cover
        env:
          DATABASE_URL: postgres://automata:automata@localhost:5432/automata?sslmode=disable
          TEST_DATABASE_URL: postgres://automata:automata@localhost:5432/automata?sslmode=disable
          JWT_SECRET: ci-test-secret-do-not-use-in-production-ok
          ENV: test

      - name: Verify logical backup and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U automata -d automata -v ON_ERROR_STOP=1 -c "CREATE TABLE backup_restore_probe (id integer PRIMARY KEY); INSERT INTO backup_restore_probe VALUES (1);"
          docker exec "$POSTGRES_CONTAINER" pg_dump -U automata -d automata --format=custom --file=/tmp/automata.dump
          docker exec "$POSTGRES_CONTAINER" createdb -U automata automata_restore
          docker exec "$POSTGRES_CONTAINER" pg_restore -U automata --dbname=automata_restore --exit-on-error --no-owner --no-acl /tmp/automata.dump
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U automata -d automata_restore -Atc 'SELECT count(*) FROM backup_restore_probe')" = "1"
          docker exec "$POSTGRES_CONTAINER" psql -U automata -d automata_restore -v ON_ERROR_STOP=1 -c 'SELECT node_id, attempts FROM workflow_node_runs LIMIT 1;'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install, lint and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npx playwright install --with-deps chromium

      - name: Browser workflow regression
        run: |
          go build -o /tmp/automata-e2e ./cmd/server
          /tmp/automata-e2e > /tmp/automata-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz > /dev/null
          cd ../frontend
          npm run test:ci
        env:
          DATABASE_URL: postgres://automata:automata@localhost:5432/automata?sslmode=disable
          JWT_SECRET: ci-test-secret-do-not-use-in-production-ok
          ENV: test
          TEST_DISABLE_RATE_LIMIT: '1'
          E2E_LOCAL_AUTH: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            frontend/test-results
            /tmp/automata-e2e.log
