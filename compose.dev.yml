name: automata-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automata -d automata_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/internal/database/migrations:/migrations:ro
    env_file:
      - ./.env
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]

volumes:
  dev_postgres_data:
